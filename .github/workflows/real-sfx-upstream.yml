# Once a week, check whether Clipwing has changed real-sfx since the commit recorded in
# skills/video-director/real-sfx/UPSTREAM.md. If so, bring the changes into a branch and open a pull request
# (a draft when some lines clash with the changes made here). Nothing is merged without a person.
name: real-sfx upstream

on:
  schedule:
    - cron: "0 14 * * 1"      # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: real-sfx-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring in Clipwing's changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          tools/sync-real-sfx.sh > sync.log 2>&1
          code=$?
          set -e
          cat sync.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 1 ]; then exit 1; fi
          new=$(sed -n 's/^- Commit: `\([0-9a-f]\{40\}\)`.*/\1/p' skills/video-director/real-sfx/UPSTREAM.md)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- skills/video-director/real-sfx)" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.sync.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.sync.outputs.code }}
          NEW: ${{ steps.sync.outputs.new }}
        run: |
          branch="real-sfx-upstream-${NEW:0:7}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "A branch for Clipwing's ${NEW:0:7} already exists; nothing to do."
            exit 0
          fi
          git add -A skills/video-director/real-sfx     # (also marks clashing files as resolved, marks and all)
          git checkout -b "$branch"
          if [ "$CODE" = 2 ]; then
            title="real-sfx: Clipwing's changes up to ${NEW:0:7} (lines to resolve)"
            draft="--draft"
            note="Some of Clipwing's changes touch lines changed in this copy. Those files hold both versions between <<<<<<< and >>>>>>> marks: resolve them, keeping both changes where possible, and check the list in UPSTREAM.md."
          else
            title="real-sfx: Clipwing's changes up to ${NEW:0:7}"
            draft=""
            note="Applied cleanly. The changes made in this copy (listed in UPSTREAM.md) are kept."
          fi
          git commit -q -m "$title"
          git push -q origin "$branch"
          {
            echo "$note"
            echo
            echo '```'
            cat sync.log
            echo '```'
            echo
            echo "Before merging: run real-sfx's self-test (\`python3 skills/video-director/real-sfx/tests/selftest.py\`, needs ffmpeg with the drawtext and rubberband filters) and Video Director's script tests, and read Clipwing's changes against \`references/sound-stage.md\`, Sound engineering (its steps, flags and the defaults it overrides)."
          } > body.md
          if ! gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "$title" --body-file body.md $draft; then
            echo "Couldn't open a pull request (the repository may not allow GitHub Actions to); opening an issue instead."
            gh issue create --title "$title" --body-file body.md
          fi
